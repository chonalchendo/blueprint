[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/chonalchendo/blueprint"
rust-version = "1.91"
publish = false

[workspace.dependencies]
bp-vault = { path = "crates/bp-vault" }
bp-design = { path = "crates/bp-design" }
bp-change = { path = "crates/bp-change" }
bp-reasoning = { path = "crates/bp-reasoning" }
bp-operation = { path = "crates/bp-operation" }
bp-check = { path = "crates/bp-check" }
bp-forge = { path = "crates/bp-forge" }
bp-install = { path = "crates/bp-install" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
yaml-rust2 = "0.13"
blake3 = "1.8"
rusqlite = { version = "0.40", features = ["bundled"] }

assert_cmd = "2.0"
tempfile = "3.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
