[package]
name = "bp-install"
description = "Installer: harness dialects, the embedded bundle, version comparison, precondition tests."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bp-vault.workspace = true
bp-operation.workspace = true
bp-forge.workspace = true
blake3.workspace = true
serde_json.workspace = true
yaml-rust2.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The edge is declared ahead of its first use (the forge preconditions), so the crate rule holds it from the start.
[package.metadata.cargo-machete]
ignored = ["bp-forge"]
